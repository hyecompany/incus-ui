name: Build Edge

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Assert attribution in dist
        run: npm run check:attribution-artifact

      - name: Package archive
        run: tar -czf incus-ui.tar.gz -C dist .

      - name: Assert attribution in archive
        run: node scripts/assert-attribution-artifact.mjs --tar incus-ui.tar.gz

      - name: Upload archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: incus-ui.tar.gz
          path: incus-ui.tar.gz
          if-no-files-found: error
